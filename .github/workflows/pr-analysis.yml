name: Shared PR Analysis

on:
  workflow_call:
    inputs:
      workflow_token:
        description: "GITHUB_TOKEN ou PAT pour accéder au dépôt partagé"
        required: false
        type: string
        default: ""
      gitleaks_license:
        description: "Licence Gitleaks"
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  security-analysis:
    name: Security & Quality Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v6

      - name: Checkout central workflow repository
        uses: actions/checkout@v6
        with:
          repository: bedy90/shared-workflows
          path: .central-workflow
          ref: dev
          token: ${{ inputs.workflow_token || secrets.GITHUB_TOKEN }}

      - name: Use Node 22.x
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Install mustache
        run: npm install mustache --legacy-peer-deps

      - name: Security Module
        uses: ./.central-workflow/.github/actions/security
        with:
          central_path: ".central-workflow"
          workflow_token: ${{ inputs.workflow_token || secrets.GITHUB_TOKEN }}
          gitleaks_license: ${{ inputs.gitleaks_license }}

      - name: Check Capabilities
        id: check_caps
        shell: bash
        run: |
          if [ -f "package.json" ] && grep -q "\"eslint\":" package.json; then
            echo "has_eslint=true" >> $GITHUB_OUTPUT
          else
            echo "has_eslint=false" >> $GITHUB_OUTPUT
          fi
          if [ -f "package.json" ] && grep -q "@angular/core" package.json; then
            echo "is_angular=true" >> $GITHUB_OUTPUT
          else
            echo "is_angular=false" >> $GITHUB_OUTPUT
          fi
          if [ -f "package.json" ] && grep -q "vitest" package.json; then
            echo "has_vitest=true" >> $GITHUB_OUTPUT
          else
            echo "has_vitest=false" >> $GITHUB_OUTPUT
          fi

      - name: Quality Module
        uses: ./.central-workflow/.github/actions/quality
        with:
          central_path: ".central-workflow"
          workflow_token: ${{ inputs.workflow_token || secrets.GITHUB_TOKEN }}
          has_eslint: ${{ steps.check_caps.outputs.has_eslint }}

      - name: Angular Module
        if: steps.check_caps.outputs.is_angular == 'true'
        uses: ./.central-workflow/.github/actions/angular
        with:
          central_path: ".central-workflow"
          workflow_token: ${{ inputs.workflow_token || secrets.GITHUB_TOKEN }}

      - name: ViTest Module
        if: steps.check_caps.outputs.has_vitest == 'true'
        uses: ./.central-workflow/.github/actions/vitest
        with:
          central_path: ".central-workflow"
          workflow_token: ${{ inputs.workflow_token || secrets.GITHUB_TOKEN }}

      - name: Commit Lint Check
        shell: bash
        run: |
          echo "Vérification des messages de commit (Placeholder)..."
          echo "Cette étape est actuellement informative."
