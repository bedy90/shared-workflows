name: Shared ViTest Check

on:
  workflow_call:
    inputs:
      enable_coverage:
        description: "Activer la couverture de code"
        required: false
        type: boolean
        default: false
      workflow_token:
        description: "Token GitHub"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  vitest-check:
    name: ViTest Execution
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node 22.x
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Checkout central workflow repository
        uses: actions/checkout@v6
        with:
          repository: bedy90/shared-workflows
          path: .central-workflow
          ref: dev
          token: ${{ inputs.workflow_token || github.token }}

      - name: ⚙️ Check ViTest Capabilities
        id: check_vitest
        shell: bash
        run: |
          if [ -f "package.json" ] && grep -q "vitest" package.json; then
            echo "has_vitest=true" >> $GITHUB_OUTPUT
          else
            echo "has_vitest=false" >> $GITHUB_OUTPUT
          fi

      - name: ViTest Analysis
        if: steps.check_vitest.outputs.has_vitest == 'true'
        uses: ./.central-workflow/.github/actions/vitest
        with:
          central_path: ".central-workflow"
          workflow_token: ${{ inputs.workflow_token || github.token }}
          enable_coverage: "${{ inputs.enable_coverage }}"
