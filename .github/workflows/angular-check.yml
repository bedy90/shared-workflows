name: Shared Angular Check

on:
  workflow_call:
    inputs:
      enable_coverage:
        description: "Activer la couverture de code"
        required: false
        type: boolean
        default: false
      workflow_token:
        description: "Token GitHub"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  angular-check:
    name: Angular Build & Tests
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node 22.x
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Checkout central workflow repository
        uses: actions/checkout@v6
        with:
          repository: bedy90/shared-workflows
          path: .central-workflow
          ref: dev
          token: ${{ inputs.workflow_token || github.token }}

      - name: ⚙️ Check Capabilities
        id: check_angular
        shell: bash
        run: |
          if [ -f "package.json" ] && grep -q "@angular/core" package.json; then
            echo "is_angular=true" >> $GITHUB_OUTPUT
          else
            echo "is_angular=false" >> $GITHUB_OUTPUT
          fi

      - name: Angular Analysis
        if: steps.check_angular.outputs.is_angular == 'true'
        uses: ./.central-workflow/.github/actions/angular
        with:
          central_path: ".central-workflow"
          workflow_token: ${{ inputs.workflow_token || github.token }}
          enable_coverage: "${{ inputs.enable_coverage }}"
