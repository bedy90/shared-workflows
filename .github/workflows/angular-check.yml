name: Angular Check

on:
  workflow_call:
    inputs:
      workflow_token:
        description: "GITHUB_TOKEN ou PAT pour accéder au dépôt partagé"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  angular-analysis:
    name: Angular Build & Assets Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v6

      - name: Checkout central workflow repository
        uses: actions/checkout@v6
        with:
          repository: bedy90/shared-workflows
          path: .central-workflow
          ref: dev
          token: ${{ inputs.workflow_token || secrets.GITHUB_TOKEN }}

      - name: Use Node 22.x
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Check if Angular
        id: check_angular
        run: |
          if [ -f "package.json" ] && grep -q "@angular/core" package.json; then
            echo "is_angular=true" >> $GITHUB_OUTPUT
          else
            echo "is_angular=false" >> $GITHUB_OUTPUT
          fi

      - name: Angular Analysis
        if: steps.check_angular.outputs.is_angular == 'true'
        uses: ./.central-workflow/.github/actions/angular
        with:
          central_path: ".central-workflow"
          workflow_token: ${{ inputs.workflow_token || secrets.GITHUB_TOKEN }}
