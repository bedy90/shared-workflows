name: PR & Commit Message Validation (Conventional Commits)

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  commit-lint:
    name: Commit Message Validation
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout calling repository
        uses: actions/checkout@v6

      - name: Checkout central workflow repository
        uses: actions/checkout@v6
        with:
          repository: bedy90/shared-workflows
          path: .central-workflow
          ref: dev
          token: ${{ github.token }}

      - name: PR Message Module
        uses: ./.central-workflow/.github/actions/commit-msg
