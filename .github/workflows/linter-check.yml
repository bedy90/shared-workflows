name: Shared Linter Check

on:
  workflow_call:
    inputs:
      workflow_token:
        description: "Token GitHub"
        required: false
        type: string
        default: ""

jobs:
  lint:
    name: ESLint Validation
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Use Node 22.x
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"

      - name: Checkout central workflow repository
        uses: actions/checkout@v6
        with:
          repository: bedy90/shared-workflows
          path: .central-workflow
          ref: dev
          token: ${{ inputs.workflow_token || github.token }}

      - name: ⚙️ Check Linter Capability
        id: check_linter
        shell: bash
        run: |
          if [ -f "package.json" ] && grep -q "\"eslint\":" package.json; then
            echo "has_eslint=true" >> $GITHUB_OUTPUT
          else
            echo "has_eslint=false" >> $GITHUB_OUTPUT
          fi

      - name: Quality Module (Lint)
        uses: ./.central-workflow/.github/actions/quality
        with:
          central_path: ".central-workflow"
          workflow_token: ${{ inputs.workflow_token || github.token }}
          has_eslint: "${{ steps.check_linter.outputs.has_eslint }}"
