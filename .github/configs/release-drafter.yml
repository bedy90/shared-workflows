# Shared Release Drafter Configuration (Core)

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features'
    labels:
      - 'feat'
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bug'
      - 'hotfix'
  - title: '🧪 Tests'
    labels:
      - 'test'
  - title: '📖 Documentation'
    labels:
      - 'docs'
      - 'documentation'
  - title: '📦 Dependencies'
    labels:
      - 'dependencies'
  - title: '🔧 Maintenance & Refactoring'
    labels:
      - 'chore'
      - 'refactor'
      - 'style'
      - 'ci'

change-template: '- $TITLE @$AUTHOR (#$NUMBER)'

template: |
  ## ✨ Quoi de neuf ?

  $CHANGES

  ---
  *Dernière mise à jour : $DATE*
