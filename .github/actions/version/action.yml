name: "Module Version Check"
description: "Vérifie l'incrément de version et l'existence du tag"

inputs:
  workflow_token:
    description: "Token GitHub"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: 🏷️ Extract Version and Check Tag
      shell: pwsh
      run: |
        if (!(Test-Path "package.json")) {
            Write-Error "Fichier package.json non trouvé à la racine."
            exit 1
        }
        
        $pkg = Get-Content "package.json" | ConvertFrom-Json
        $version = $pkg.version
        $tagName = "v$version"
        
        Write-Host "ℹ️ Version détectée : $version"
        Write-Host "ℹ️ Tag attendu : $tagName"
        
        # Vérification si le tag existe déjà sur le dépôt distant
        $tagExists = git ls-remote --tags origin $tagName
        if ($tagExists) {
            Write-Error "❌ Le tag $tagName existe déjà sur le dépôt distant. Veuillez incrémenter la version dans le package.json."
            exit 1
        }
        
        Write-Host "✅ La version $version est nouvelle. Le tag $tagName peut être créé."
