name: "Module Qualité"
description: "Exécute ESLint, Outdated et Vérification de Casse"

inputs:
  central_path:
    description: "Chemin vers le dépôt shared-workflows"
    required: true
  workflow_token:
    description: "Token GitHub"
    required: false
    default: ""
  has_eslint:
    description: "Indique si ESLint est présent"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Check Case Sensitivity
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.workflow_token || github.token }}
        script: |
          const caseScript = require(`${process.env.GITHUB_WORKSPACE}/${JSON.parse(process.env.INPUT_CENTRAL_PATH)}/.github/scripts/case-check.cjs`);
          await caseScript({ 
            github, 
            context, 
            templatePath: `${process.env.GITHUB_WORKSPACE}/${JSON.parse(process.env.INPUT_CENTRAL_PATH)}/.github/template/case-check.md` 
          });

    - name: Check Outdated Packages
      shell: bash
      run: npm outdated --json > outdated.json || true

    - name: Post Outdated Comment
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.workflow_token || github.token }}
        script: |
          const outdatedScript = require(`${process.env.GITHUB_WORKSPACE}/${JSON.parse(process.env.INPUT_CENTRAL_PATH)}/.github/scripts/outdated.cjs`);
          await outdatedScript({ 
            github, 
            context, 
            templatePath: `${process.env.GITHUB_WORKSPACE}/${JSON.parse(process.env.INPUT_CENTRAL_PATH)}/.github/template/outdated.md` 
          });

    - name: Linter Check
      if: inputs.has_eslint == 'true'
      shell: bash
      run: npx eslint . -f json > eslint-report.json || true

    - name: Post ESLint Comment
      if: inputs.has_eslint == 'true'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.workflow_token || github.token }}
        script: |
          const eslintScript = require(`${process.env.GITHUB_WORKSPACE}/${JSON.parse(process.env.INPUT_CENTRAL_PATH)}/.github/scripts/eslint.cjs`);
          await eslintScript({ 
            github, 
            context, 
            templatePath: `${process.env.GITHUB_WORKSPACE}/${JSON.parse(process.env.INPUT_CENTRAL_PATH)}/.github/template/eslint.md` 
          });
