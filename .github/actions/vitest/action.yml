name: "Module ViTest"
description: "Exécute les tests ViTest et l'analyse des résultats"

inputs:
  central_path:
    description: "Chemin vers le dépôt shared-workflows"
    required: true
  workflow_token:
    description: "Token GitHub"
    required: false
    default: ""
  enable_coverage:
    description: "Activer la couverture de code"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: ViTest Execution
      shell: bash
      run: |
        if [ "${{ inputs.enable_coverage }}" = "true" ]; then
          echo "📊 Exécution avec couverture..."
          npx vitest run --coverage --reporter=json --outputFile=vitest-report.json || true
        else
          echo "🧪 Exécution standard..."
          npx vitest run --reporter=json --outputFile=vitest-report.json || true
        fi

    - name: ViTest Analysis
      uses: actions/github-script@v8
      with:
        github-token: ${{ inputs.workflow_token || github.token }}
        script: |
          const vitestScript = require(`${process.env.GITHUB_WORKSPACE}/${{ inputs.central_path }}/.github/scripts/vitest.cjs`);
          await vitestScript({ 
            github, 
            context, 
            templatePath: `${process.env.GITHUB_WORKSPACE}/${{ inputs.central_path }}/.github/template/vitest.md` 
          });

    - name: 📈 ViTest Coverage Report
      if: inputs.enable_coverage == 'true'
      uses: davelosert/vitest-coverage-report-action@v2
      with:
        json-summary-path: './coverage/coverage-summary.json'
        json-final-path: './coverage/coverage-final.json'
